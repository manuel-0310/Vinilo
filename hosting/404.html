<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No encontramos esto · Vinilo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0E0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0E0C;--text:#F4EFE6;--text2:#A9A296;--accent:#E8A04B;--serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center}
.vinyl{width:120px;height:120px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,var(--bg) 0 3%,var(--accent) 3.5% 17%,#0b0a09 17.5% 19%,transparent 19.5%),repeating-radial-gradient(circle,#1b1916 0 2px,#0c0b0a 2px 4px)}
h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.04;margin-top:26px}
p{color:var(--text2);margin-top:10px;max-width:360px}
a{display:inline-block;margin-top:18px;color:var(--accent);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="vinyl" aria-hidden="true"></div>
  <h1 data-es="No encontramos esto" data-en="We couldn't find this">No encontramos esto</h1>
  <p data-es="Puede que lo hayan borrado o que el enlace esté incompleto." data-en="It may have been deleted, or the link is incomplete.">Puede que lo hayan borrado o que el enlace esté incompleto.</p>
  <a href="/" data-es="Ir al inicio" data-en="Go home">Ir al inicio</a>
</main>
<script>
(function(){
  var langs = navigator.languages || [navigator.language || 'es'];
  for (var i = 0; i < langs.length; i++) {
    var code = String(langs[i]).slice(0, 2).toLowerCase();
    if (code === 'es') return;
    if (code === 'en') {
      document.documentElement.lang = 'en';
      document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
      return;
    }
  }
})();
</script>
</body>
</html>
